<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>○○学校 文化祭 2025</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="school-name">○○学校</div>
        </header>
        
        <main class="main-content">
            <div class="hero-section">
                <h1 class="festival-title">文化祭</h1>
                
                <div class="date-container">
                    <div class="date-block">
                        <div class="date-number">20</div>
                        <div class="date-info">
                            <span class="month">07</span>
                            <span class="day">Sun</span>
                        </div>
                    </div>
                    
                    <div class="date-separator">・</div>
                    
                    <div class="date-block">
                        <div class="date-number">21</div>
                        <div class="date-info">
                            <span class="month">07</span>
                            <span class="day">Mon</span>
                        </div>
                    </div>
                </div>
                
                <div class="year">2025</div>
                
                <div class="cta-section">
                    <button class="cta-button">詳細を見る</button>
                    <button class="cta-button secondary">プログラム</button>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <div class="footer-content">
                <p>皆様のご来場をお待ちしております</p>
            </div>
        </footer>
    </div>
</body>
</html>
